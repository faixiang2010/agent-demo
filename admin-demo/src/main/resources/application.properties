server.port=8087

# ---- AgentScope admin starter（默认关闭，必须显式开启）----
agentscope.admin.enabled=true
agentscope.admin.write-enabled=true

# ---- 自动装配一个最简 ReActAgent（无需真实 Key 即可启动，仅注册不对话）----
agentscope.agent.enabled=true
agentscope.agent.name=demo-agent
agentscope.agent.sys-prompt=You are a minimal demo agent.
agentscope.agent.max-iters=3

# ---- DashScope 模型（占位 Key；构建 Model bean 不会发请求）----
agentscope.dashscope.api-key=${DASHSCOPE_API_KEY:sk-placeholder-for-ui-preview}
agentscope.dashscope.model-name=qwen-plus

# ---- Actuator：暴露全部端点便于验证 ----
management.endpoints.web.exposure.include=*
