# ============================================================
# 大模型配置（OpenAI 兼容协议，默认对接 DeepSeek）
# 修改后重新运行即可生效，无需改代码
# ============================================================

# API 地址（OpenAI 兼容端点；切换其他兼容厂商时改这里）
llm.base-url=https://api.deepseek.com

# 模型名称（DeepSeek：deepseek-chat / deepseek-reasoner）
llm.model=deepseek-flash

# API 密钥：请勿在此明文填写并提交到代码仓库！
# 留空时自动读取环境变量 DEEPSEEK_API_KEY（环境变量优先级更高）
llm.api-key=${DEEPSEEK_API_KEY:}

# 是否使用流式输出（true/false）
llm.stream=true

# 会话与记忆压缩参数（对应 HarnessAgent 的 CompactionConfig）
llm.compaction.trigger-messages=30
llm.compaction.keep-messages=10

# ============================================================
# AgentScope Studio（可视化调试 / 链路回放 / Human-in-the-Loop）
# 使用前需先启动 Studio 服务：https://github.com/agentscope-ai/agentscope-studio
# 默认关闭；服务启动后改为 true 即可自动推送消息与事件
# ============================================================
studio.enabled=false
studio.url=http://localhost:3000
#studio.enabled=true
#studio.url=http://<your-studio-host>:3009
studio.project=agentscope-java-demo
studio.run-name=first-agent-run

# ============================================================
# Jev 判定客户端（TypeSafe System One：路由 / 评分 / 分类）
# 文档：https://java.agentscope.io/v2/zh/jev
# ============================================================

# 总开关（false 时 JevDemo 直接提示并退出）
jev.enabled=false

# API 密钥：留空时依次读取环境变量 TYPESAFE_API_KEY、JEV_API_KEY
jev.api-key=1234567890abcdef1234567890abcdef

# API 地址与模型（默认 https://api.typesafe.ai + jev-latest）
# jev.base-url=https://api.typesafe.ai
# 将 base-url 指向本地 Ollaya 服务
jev.base-url=http://127.0.0.1:11435
#jev.model=jev-latest
# 指定使用你下载的模型
jev.model=laya:typed-decisions

# 请求超时（秒）与重试（次数、初始退避毫秒）
jev.timeout-seconds=5
jev.retry.max-retries=2
jev.retry.initial-backoff-millis=500