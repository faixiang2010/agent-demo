[project]
name = "lang-graph-demo"
version = "0.1.0"
description = "LangGraph QuickStart Demo with DeepSeek"
authors = [{ name = "Demo Author", email = "demo@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"