[project]
name = "lang-deepagents-demo"
version = "0.1.0"
description = "LangChain DeepAgents QuickStart Demo with DeepSeek"
authors = [{ name = "Demo Author", email = "demo@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "deepagents>=0.2.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"